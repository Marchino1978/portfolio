<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ETF charts</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px dotted #30363d; padding-bottom: 15px; }
        .info-panel h2 { margin: 0; color: #58a6ff; font-size: 20px; letter-spacing: 0.5px; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 1100px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
        .card { background: #161b22; border-radius: 6px; padding: 12px; border: 1px solid #30363d; height: 190px; display: flex; flex-direction: column; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card h3 { margin: 0; font-size: 13px; letter-spacing: 1px; color: #8b949e; }
        .price-label { font-size: 12px; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
        .controls { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
        button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 35px; }
        button:hover { background: #30363d; }
        button.active { background: #1f6feb; border-color: #58a6ff; color: white; }
        canvas { flex-grow: 1; width: 100% !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="info-panel"><h2>ETF charts</h2></div>
    <div class="controls">
        <button onclick="caricaDashboard(7, 'v2', this)">W</button>
        <button onclick="caricaDashboard(30, 'v3', this)" class="active">M</button>
        <button onclick="caricaDashboard(365, 'Y', this)">Y</button>
    </div>
</div>

<div id="grid" class="grid-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const SB_URL = 'https://guachqkrfatfuahckyqp.supabase.co';
    const SB_KEY = 'sb_publishable_XrSS9bV3k8x-rlV4zMtPcw_IN3bczvN';
    let supabaseClient;
    let chartInstances = {}; 
    let marketData = []; // Dati da market.json

    async function inizializzaDashboard() {
        // 1. Carichiamo i dati "ufficiali" dal tuo market.json
        try {
            const response = await fetch('/api/market-status');
            const json = await response.json();
            marketData = json.values.data;
        } catch (e) {
            console.error("Errore caricamento market.json", e);
        }

        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
            caricaDashboard(30, 'v3'); // Default M
        }
    }

    async function caricaDashboard(giorni, chiaveVariazione, btn) {
        if (!supabaseClient) return;
        if(btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const dataInizio = new Date();
        dataInizio.setDate(dataInizio.getDate() - giorni);
        const isoData = dataInizio.toISOString().split('T')[0];

        const { data: dbData, error } = await supabaseClient
            .from('previous_close')
            .select('*')
            .gte('snapshot_date', isoData) 
            .order('snapshot_date', { ascending: true });

        if (error) return;

        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        // Usiamo l'ordine e i simboli presenti in marketData
        marketData.forEach(etfJson => {
            const sym = etfJson.symbol;
            const history = dbData.filter(d => d.symbol === sym);
            if (history.length < 1) return;

            // PRENDIAMO IL VALORE DAL JSON (es: "-3.57%M")
            const varUfficiale = etfJson[chiaveVariazione] || etfJson.dailyChange;
            const colore = varUfficiale.includes('-') ? '#f85149' : '#3fb950';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <h3>${sym}</h3>
                    <span class="price-label" style="color: ${colore}">
                        ${etfJson.price.toFixed(2)} € (${varUfficiale.split('%')[0]}%)
                    </span>
                </div>
                <canvas id="chart-${sym}"></canvas>
            `;
            grid.appendChild(card);
            renderMiniChart(sym, history, colore);
        });
    }

    function renderMiniChart(sym, dati, colore) {
        if (chartInstances[sym]) chartInstances[sym].destroy();
        const ctx = document.getElementById(`chart-${sym}`).getContext('2d');
        chartInstances[sym] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: dati.map(d => d.snapshot_date),
                datasets: [{
                    data: dati.map(d => d.close_value),
                    borderColor: colore, 
                    borderWidth: 1.5, 
                    pointRadius: 0, 
                    tension: 0.1, 
                    fill: true, 
                    backgroundColor: colore + '10'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: true } },
                scales: { 
                    x: { display: false }, 
                    y: { grid: { color: '#21262d' }, ticks: { color: '#484f58', font: { size: 10 } } } 
                }
            }
        });
    }

    inizializzaDashboard();
</script>
</body>
</html>
