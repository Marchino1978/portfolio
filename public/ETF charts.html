<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ETF charts</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px dotted #30363d; padding-bottom: 15px; }
        .info-panel h2 { margin: 0; color: #58a6ff; font-size: 20px; letter-spacing: 0.5px; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 1100px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
        .card { background: #161b22; border-radius: 6px; padding: 12px; border: 1px solid #30363d; height: 190px; display: flex; flex-direction: column; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card h3 { margin: 0; font-size: 13px; letter-spacing: 1px; color: #8b949e; }
        .price-label { font-size: 12px; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
        .controls { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
        button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; min-width: 35px; }
        button:hover { background: #30363d; }
        button.active { background: #1f6feb; border-color: #58a6ff; color: white; }
        canvas { flex-grow: 1; width: 100% !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="info-panel"><h2>ETF charts</h2></div>
    <div class="controls">
        <button onclick="caricaDati(7, this)" class="active">W</button>
        <button onclick="caricaDati(30, this)">M</button>
        <button onclick="caricaDati(90, this)">Q</button>
        <button onclick="caricaDati(180, this)">H</button>
        <button onclick="caricaDati(365, this)">Y</button>
        <button onclick="caricaDati(1095, this)">3</button>
        <button onclick="caricaDati(1825, this)">5</button>
    </div>
</div>

<div id="grid" class="grid-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const SB_URL = 'https://guachqkrfatfuahckyqp.supabase.co';
    const SB_KEY = 'sb_publishable_XrSS9bV3k8x-rlV4zMtPcw_IN3bczvN';
    const mieiETF = ["VUAA", "VNGA80", "GOLD", "XEON", "VWCE", "EXUS", "EIMI"];
    let supabaseClient;
    let chartInstances = {};

    function init() {
        supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
        caricaDati(7);
    }

    async function caricaDati(giorni, btn) {
        if(btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        for (const sym of mieiETF) {
            const { data: lastRecord } = await supabaseClient
                .from('previous_close')
                .select('close_value, snapshot_date')
                .eq('symbol', sym)
                .order('snapshot_date', { ascending: false })
                .limit(1);

            if (!lastRecord?.length) continue;

            const priceToday = parseFloat(lastRecord[0].close_value);
            const dateTodayStr = lastRecord[0].snapshot_date;

            const d = new Date(dateTodayStr);
            d.setDate(d.getDate() - giorni);
            const isoTarget = d.toISOString().split('T')[0];

            const { data: pastRecord } = await supabaseClient
                .from('previous_close')
                .select('close_value, snapshot_date')
                .eq('symbol', sym)
                .lte('snapshot_date', isoTarget)
                .order('snapshot_date', { ascending: false })
                .limit(1);

            if (!pastRecord?.length) continue;

            const pricePast = parseFloat(pastRecord[0].close_value);
            const datePastStr = pastRecord[0].snapshot_date;

            const { data: history } = await supabaseClient
                .from('previous_close')
                .select('snapshot_date, close_value')
                .eq('symbol', sym)
                .gte('snapshot_date', datePastStr)
                .lte('snapshot_date', dateTodayStr)
                .order('snapshot_date', { ascending: true });

            const variation = ((priceToday - pricePast) / pricePast) * 100;
            
            const color = variation >= 0 ? '#3fb950' : '#f85149';
            const sign = variation >= 0 ? '+' : '';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <h3 style="color: #f2cc60;">${sym}</h3>
                    <span class="price-label" style="color: ${color}">
                        ${priceToday.toFixed(2)} € (${sign}${variation.toFixed(2)}%)
                    </span>
                </div>
                <canvas id="chart-${sym}"></canvas>
            `;
            grid.appendChild(card);
            renderChart(sym, history, color);
        }
    }

    function renderChart(sym, history, color) {
        if (chartInstances[sym]) chartInstances[sym].destroy();
        const ctx = document.getElementById(`chart-${sym}`).getContext('2d');
        chartInstances[sym] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: history.map(h => h.snapshot_date),
                datasets: [{
                    data: history.map(h => h.close_value),
                    borderColor: color,
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1,
                    fill: true,
                    backgroundColor: color + '10'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: true } },
                scales: { 
                    x: { display: false }, 
                    y: { 
                        grid: { color: '#30363d', display: true }, 
                        ticks: { color: '#484f58', font: { size: 9 } } 
                    } 
                }
            }
        });
    }

    init();
</script>
</body>
</html>
